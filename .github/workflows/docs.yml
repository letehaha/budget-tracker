name: Docs

on:
  pull_request:
    paths: ['packages/docs/**']
  push:
    branches: [main]
    paths: ['packages/docs/**']
  workflow_dispatch:

jobs:
  # The build fails on broken internal links (starlight-links-validator) and invalid MDX.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/docs/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./packages/docs
          push: true
          tags: |
            letehaha/budget-tracker-docs:latest
            letehaha/budget-tracker-docs:sha-${{ github.sha }}
      - name: Trigger Dokploy deployment
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.DOKPLOY_DOCS_DEPLOY_WEBHOOK_URL }}" | grep -q "200" \
            || (echo "Dokploy docs deploy webhook failed" && exit 1)
